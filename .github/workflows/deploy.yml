# Publishes the app (the public/ folder) to GitHub Pages, and refreshes the
# charger list every Monday so the website stays up to date on its own.
name: Update chargers & publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0'   # every Monday 02:00 Malaysia time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download latest charger list
        run: node scripts/update-chargers.js
      - name: Save it if anything changed
        run: |
          if ! git diff --quiet -- public/data/chargers-osm.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Weekly charger list update"
            git push
          else
            echo "No charger changes this week."
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
